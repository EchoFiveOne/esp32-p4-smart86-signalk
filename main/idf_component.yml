dependencies:
  idf: ">=5.5.6"

  # WiFi remote — ESP32-P4 has no built-in WiFi; this component routes esp_wifi_*
  # calls to the ESP32-C6 coprocessor over SDIO.
  espressif/esp_wifi_remote:
    version: ">=0.1.12"
    rules:
      - if: "target in [esp32p4]"

  # esp-hosted — SDIO transport layer between P4 (host) and C6 (slave)
  # Pinned exactly to 2.12.3 — 2.12.6 crashes at sdio_mempool_create on this board.
  # The previous "~2.12.3" allowed >=2.12.3 <2.13.0 (IDF semver tilde) which let
  # 2.12.6 in. Use exact "==" to prevent any patch-level drift.
  espressif/esp_hosted:
    version: "==2.12.3"
    rules:
      - if: "target in [esp32p4]"

  # Waveshare ESP32-P4-WIFI6-Touch-LCD-4B BSP
  # Retained for board I2C, touch, backlight, and audio support.
  waveshare/esp32_p4_wifi6_touch_lcd_4b: "^1.0.1"

  # Board Manager probes the LCD ID and selects the matching panel driver.
  espressif/esp_board_manager: "^0.7.6"
  waveshare/waveshare_boards: "^0.3.5"
  # Directly expose the BSP's GT911 touch API to the application.
  espressif/esp_lcd_touch: "^1.2.1"

  # ESP-UI (esp-brookesia) v0.2.x - phone launcher shell
  # LVGL 8.x based
  espressif/esp-ui:
    version: "0.2.*"

  # WebSocket client — moved out of IDF core in v5.x, now a managed component.
  # CMake REQUIRES name: esp_websocket_client
  espressif/esp_websocket_client: "~1.6.0"

  # mDNS — service discovery for SignalK servers on the local network
  espressif/mdns: "~1.11.0"
